<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIM PULLANITHAZHAM - Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .arabic-text { font-family: 'Amiri', serif; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Styles for the paper-like grid layout */
        .paper-grid {
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .paper-grid th, .paper-grid td {
            border: 1px solid #e5e7eb;
            padding: 8px;
            text-align: center;
            font-size: 14px;
        }
        .paper-grid th { background-color: #f9fafb; font-weight: 600; color: #4b5563; }
        .paper-grid td:first-child { font-weight: 600; color: #374151; background-color: #f9fafb; width: 60px;}
        
        .paper-grid tr.excused-row td { background-color: #fdf2f8 !important; }
        .excused-text { color: #db2777; font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; letter-spacing: 1px;}
        
        .student-header {
            background: #f3f4f6; padding: 12px; font-weight: bold; font-size: 16px; color: #1f2937;
            border-bottom: 2px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center;
        }

        .summary-bar {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 8px 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }
        .summary-bar span { display: flex; align-items: center; gap: 4px;}

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <div id="loading-overlay" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-blue-700 font-bold text-lg animate-pulse">Loading Madrasa Records...</p>
    </div>

    <nav id="main-nav" class="bg-white border-b border-gray-200 shadow-sm z-40 flex-shrink-0 hidden">
        <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 w-full">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-100 p-2 rounded-lg text-blue-700">
                        <i class="fa-solid fa-users"></i>
                    </div>
                    <span class="font-bold text-lg text-blue-800 hidden sm:block">HIM PULLANITHAZHAM</span>
                    <span class="font-bold text-lg text-blue-800 sm:hidden">HIM Madrasa</span>
                </div>
                
                <div class="flex space-x-1 bg-gray-100 p-1 rounded-lg">
                    <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-4 py-1.5 text-sm font-medium rounded-md transition bg-white shadow-sm text-gray-800">Summary</button>
                    <button onclick="switchTab('sheet')" id="tab-sheet" class="px-4 py-1.5 text-sm font-medium rounded-md transition text-gray-500 hover:text-gray-700">Tracker Sheets</button>
                </div>
            </div>
        </div>
    </nav>

    <main id="app-content" class="flex-grow overflow-y-auto bg-[#f8fafc] p-4 md:p-6 w-full fade-in hidden">
        <div class="max-w-[1400px] mx-auto space-y-6">
            
            <!-- Global Month Selector (Affects entire app) -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h2 class="text-lg font-bold text-gray-800" id="month-title">Current Tracking Period</h2>
                    <p class="text-xs text-gray-500">You can view past months by selecting a different date.</p>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <label class="text-sm font-bold text-gray-700 shrink-0"><i class="fa-regular fa-calendar mr-1"></i> View Month:</label>
                    <input type="month" id="student-month-selector" class="w-full sm:w-auto px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer font-medium bg-gray-50 text-gray-700 shadow-inner">
                </div>
            </div>

            <!-- Dashboard View -->
            <div id="student-dashboard-view" class="space-y-6">
                <!-- Message and Insights -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-6 md:p-8 text-white shadow-lg relative overflow-hidden">
                        <i class="fa-solid fa-quote-left text-blue-400/30 text-6xl absolute top-4 left-4"></i>
                        <div class="relative z-10">
                            <h2 class="text-blue-100 text-sm uppercase tracking-wider font-bold mb-2">Usthad's Message</h2>
                            <p id="student-usthad-msg" class="text-xl md:text-2xl font-medium leading-relaxed mb-6">Loading...</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex flex-col justify-center">
                        <h3 class="text-gray-800 font-bold mb-4 flex items-center"><i class="fa-solid fa-robot text-emerald-500 mr-2"></i> Performance Insights</h3>
                        <ul id="smart-insights-list" class="space-y-3 text-sm text-gray-600">
                            <!-- Populated by JS -->
                        </ul>
                    </div>
                </div>

                <!-- Detailed Breakdown Leaderboard -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <div class="flex items-center justify-between mb-6 flex-wrap gap-2">
                        <h2 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-chart-pie text-blue-500 mr-2"></i> Overall Leaderboard</h2>
                    </div>
                    <div id="detailed-stats-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-5">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <!-- Sheets View -->
            <div id="sheet-view" class="hidden space-y-4">
                <div id="paper-sheets-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 pb-10">
                    <!-- Populated by JS -->
                </div>
            </div>
            
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6ruQWH9yo2eVIzTytjg8QL51a3uQzhY0",
            authDomain: "prayers-9.firebaseapp.com",
            projectId: "prayers-9",
            storageBucket: "prayers-9.firebasestorage.app",
            messagingSenderId: "990655719635",
            appId: "1:990655719635:web:b94075337b5f535784cc26",
            measurementId: "G-GC2NZS7ZM6"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const STUDENTS = [
            { name: 'Niswa', gender: 'girl' }, { name: 'Shahma', gender: 'girl' },
            { name: 'Rashid', gender: 'boy' }, { name: 'Shamil', gender: 'boy' }, { name: 'Nafith', gender: 'boy' }
        ];
        const PRAYERS = ['Subh', 'Luhr', 'Asr', 'Magrib', 'Isha'];
        const PRAYER_ARABIC = ['صبح', 'ظهر', 'عصر', 'مغرب', 'عشاء']; 
        
        // --- Built-in Islamic Quotes Engine (Malayalam) ---
        // --- Built-in Islamic Quotes Engine (Arabic + Malayalam) ---
        const islamicQuotes = [
            {
                arabic: "إِنَّ مَعَ الْعُسْرِ يُسْرًا",
                malayalam: "നിശ്ചയമായും, പ്രയാസത്തോടൊപ്പം എളുപ്പവുമുണ്ട്. (വിശുദ്ധ ഖുർആൻ 94:6)"
            },
            {
                arabic: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",
                malayalam: "നമുക്ക് അല്ലാഹു മതി! അവൻ എത്രയോ നല്ല ഭരമേൽപ്പിക്കപ്പെടുന്നവൻ! (വിശുദ്ധ ഖുർആൻ 3:173)"
            },
            {
                arabic: "وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ",
                malayalam: "എന്റെ വിജയവും അനുഗ്രഹവും അല്ലാഹുവിൽ നിന്നു മാത്രമാണ്. (വിശുദ്ധ ഖുർആൻ 11:88)"
            },
            {
                arabic: "الصَّبْرُ نِصْفُ الإِيمَانِ",
                malayalam: "ക്ഷമ എന്നത് വിശ്വാസത്തിന്റെ പകുതിയാണ്. (ഹദീസ്)"
            },
            {
                arabic: "خِيَارُكُمْ أَحَاسِنُكُمْ أَخْلاقًا",
                malayalam: "നിങ്ങളിൽ ഏറ്റവും ഉത്തമർ സൽസ്വഭാവികളാണ്. (ബുഖാരി)"
            },
            {
                arabic: "الطُّهُورُ شَطْرُ الإِيمَانِ",
                malayalam: "ശുചിത്വം വിശ്വാസത്തിന്റെ പകുതിയാണ്. (മുസ്ലിം)"
            },
            {
                arabic: "وَلَا تَهِنُوا وَلَا تَحْزَنُوا",
                malayalam: "നിങ്ങൾ ദുഃഖിക്കുകയോ നിരാശപ്പെടുകയോ അരുത്. (വിശുദ്ധ ഖുർആൻ 3:139)"
            },
            {
                arabic: "لَيْسَ مِنَّا مَنْ لَمْ يَرْحَمْ صَغِيرَنَا وَيُوَقِّرْ كَبِيرَنَا",
                malayalam: "ചെറിയവരോട് കരുണ കാണിക്കാത്തവനും മുതിർന്നവരെ ബഹുമാനിക്കാത്തവനും നമ്മിൽ പെട്ടവനല്ല. (തിർമിദി)"
            },
            {
                arabic: "طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ",
                malayalam: "അറിവ് നേടൽ ഓരോ മുസ്ലിമിനും നിർബന്ധമാണ്. (ഇബ്നു മാജ)"
            },
            {
                arabic: "إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ",
                malayalam: "നിശ്ചയം, പശ്ചാത്തപിച്ചു മടങ്ങുന്നവരെയും ശുചിത്വം പാലിക്കുന്നവരെയും അല്ലാഹു ഇഷ്ടപ്പെടുന്നു. (വിശുദ്ധ ഖുർആൻ 2:222)"
            }
        ];

        // Get a random quote based on the current day of the month
        function getDailyQuote() {
            const todayNum = new Date().getDate();
            const quoteIndex = todayNum % islamicQuotes.length;
            return islamicQuotes[quoteIndex];
        }
        
        let allRecords = {};
        
        const today = new Date();
        const currentYearStr = today.getFullYear();
        const currentMonthStr = String(today.getMonth() + 1).padStart(2, '0');
        let selectedViewMonth = `${currentYearStr}-${currentMonthStr}`;

        const monthSelector = document.getElementById('student-month-selector');
        monthSelector.value = selectedViewMonth;

        monthSelector.addEventListener('change', (e) => {
            selectedViewMonth = e.target.value;
            const [y, m] = selectedViewMonth.split('-');
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('month-title').innerText = `${monthNames[parseInt(m)-1]} ${y} Tracking Period`;
            
            updateViews(); // Recalculate everything for the new month
        });

        // Smart Date Generator
        function getDatesForViewMonth() {
            const [y, m] = selectedViewMonth.split('-');
            const year = parseInt(y);
            const month = parseInt(m) - 1; 
            
            let startDay = 1; // By default, EVERY month automatically starts on the 1st
            
            // Strict check: ONLY September 2026 starts on the 9th
            if (year === 2026 && month === 8) { 
                startDay = 9;
            }
            
            // Automatically gets the exact number of days in ANY selected month (e.g., Oct=31, Nov=30)
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const dates = [];
            
            for (let d = startDay; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                dates.push(dateStr);
            }
            return dates;
        }

        async function initApp() {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) setupListeners();
                });
            } catch (err) {
                console.error("Auth Error:", err);
                document.getElementById('loading-overlay').innerHTML = "<p class='text-red-500 p-4 text-center'>Error connecting to database. Please check connection.</p>";
            }
        }

        function setupListeners() {
            const settingsRef = doc(db, 'madrasa_settings', 'global');
            const recordsRef = collection(db, 'salah_monthly');

            onSnapshot(settingsRef, (docSnap) => {
                // Determine what message to show: Use Admin message if it exists and isn't empty, otherwise use daily random quote.
                let displayMsgHtml = "";
                let adminMsg = docSnap.exists() ? docSnap.data().advisement : "";
                
                if (adminMsg && adminMsg.trim() !== "") {
                     displayMsgHtml = `<div class="text-xl font-medium">"${adminMsg}"</div>`;
                } else {
                     const daily = getDailyQuote();
                     displayMsgHtml = `<div class="flex flex-col gap-4 text-center items-center justify-center pt-2">
                        <span class="text-3xl md:text-4xl font-normal arabic-text leading-relaxed text-blue-50 drop-shadow-md" dir="rtl">${daily.arabic}</span>
                        <span class="text-blue-200 text-[15px] md:text-base font-bold">${daily.malayalam}</span>
                     </div>`;
                }
                
                document.getElementById('student-usthad-msg').innerHTML = displayMsgHtml;
            }, (error) => console.error(error));

            onSnapshot(recordsRef, (snapshot) => {
                allRecords = {};
                snapshot.forEach(doc => { allRecords[doc.id] = doc.data(); });
                
                document.getElementById('loading-overlay').classList.add('hidden');
                document.getElementById('main-nav').classList.remove('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                
                // Initialize title
                const [y, m] = selectedViewMonth.split('-');
                const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                document.getElementById('month-title').innerText = `${monthNames[parseInt(m)-1]} ${y} Tracking Period`;
                
                updateViews();
            }, (error) => console.error(error));
        }

        function calculateDetailedStats() {
            let stats = {};
            STUDENTS.forEach(s => {
                stats[s.name] = { 
                    totalCount: 0, 
                    totalPotential: 0, 
                    gender: s.gender,
                    excusedWaqths: 0,
                    breakdown: { 'Subh': 0, 'Luhr': 0, 'Asr': 0, 'Magrib': 0, 'Isha': 0 }
                };
            });
            
            const dates = getDatesForViewMonth();

            dates.forEach(date => {
                const dayData = allRecords[date] || {};
                
                STUDENTS.forEach(s => {
                    const sData = dayData[s.name] || {};
                    let isFullDayExcused = sData.excused === true; // Legacy fallback
                    
                    PRAYERS.forEach(p => { 
                        let val = sData[p];
                        if (isFullDayExcused) val = 'excused';
                        
                        if (val === 'excused') {
                            stats[s.name].excusedWaqths++; 
                        } else {
                            stats[s.name].totalPotential++;
                            if (val === true || val === '1') {
                                stats[s.name].totalCount++; 
                                stats[s.name].breakdown[p]++;
                            }
                        }
                    });
                });
            });

            return { stats, dates };
        }

        function updateViews() {
            const { stats, dates } = calculateDetailedStats();
            
            // Render Detailed Stats Cards
            const container = document.getElementById('detailed-stats-container');
            container.innerHTML = '';
            
            let ranked = Object.entries(stats).sort((a,b) => {
                let pctA = a[1].totalPotential === 0 ? 0 : (a[1].totalCount / a[1].totalPotential);
                let pctB = b[1].totalPotential === 0 ? 0 : (b[1].totalCount / b[1].totalPotential);
                return pctB - pctA; // Sort by percentage, fair for excused days
            });
            
            ranked.forEach(([name, data], index) => {
                let medal = index === 0 ? '<i class="fa-solid fa-medal text-yellow-500 text-xl"></i>' : 
                            index === 1 ? '<i class="fa-solid fa-medal text-gray-400 text-lg"></i>' : 
                            index === 2 ? '<i class="fa-solid fa-medal text-amber-700 text-base"></i>' : 
                            `<span class="font-bold text-gray-400 text-sm">#${index+1}</span>`;
                
                let pct = data.totalPotential === 0 ? 100 : Math.round((data.totalCount/data.totalPotential)*100);
                let colorClass = data.gender === 'girl' ? 'bg-pink-50 border-pink-100' : 'bg-blue-50 border-blue-100';

                let breakdownHtml = PRAYERS.map((p, i) => `
                    <div class="flex justify-between items-center text-sm py-1 border-b border-black/5 last:border-0">
                        <span class="text-gray-600 font-medium">${p} <span class="arabic-text text-gray-400 ml-1">(${PRAYER_ARABIC[i]})</span></span>
                        <span class="font-bold text-gray-800 bg-white px-2 rounded shadow-sm">${data.breakdown[p]}</span>
                    </div>
                `).join('');

                let excusedHtml = data.excusedWaqths > 0 
                    ? `<div class="text-xs text-pink-600 font-medium mt-2 bg-pink-100/50 p-1.5 rounded text-center border border-pink-200/50">
                        <i class="fa-solid fa-moon mr-1"></i> ${data.excusedWaqths} Waqth(s) excused<br>
                       </div>` 
                    : '';

                container.innerHTML += `
                    <div class="${colorClass} border rounded-2xl p-5 flex flex-col relative transition hover:shadow-lg hover:-translate-y-1">
                        <div class="flex justify-between items-center mb-4">
                            <h4 class="font-bold text-gray-800 text-xl uppercase tracking-wide">${name}</h4>
                            ${medal}
                        </div>
                        
                        <div class="flex items-end gap-2 mb-2">
                            <span class="text-4xl font-black text-gray-800 leading-none">${data.totalCount}</span>
                            <span class="text-sm font-medium text-gray-500 mb-1 tracking-tight">/ ${data.totalPotential}</span>
                        </div>
                        
                        <div class="flex-grow mb-4 mt-2 bg-white/70 p-3 rounded-xl border border-white">
                            ${breakdownHtml}
                        </div>
                        
                        <div class="mt-auto">
                            <div class="flex justify-between text-[11px] text-gray-500 uppercase font-bold tracking-wider mb-1.5">
                                <span>Completion</span>
                                <span>${pct}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2 mb-1 shadow-inner overflow-hidden">
                                <div class="bg-blue-500 h-full rounded-full" style="width: ${pct}%"></div>
                            </div>
                            ${excusedHtml}
                        </div>
                    </div>
                `;
            });

            // Smart Insights
            const list = document.getElementById('smart-insights-list');
            list.innerHTML = '';
            if (ranked[0][1].totalCount > 0) {
                list.innerHTML += `<li><i class="fa-solid fa-star text-yellow-500 w-5"></i> <b>Masha Allah ${ranked[0][0]}!</b> Leading the class right now.</li>`;
            }
            
            let totalPrayers = 0, totalPotential = 0;
            Object.values(stats).forEach(t => { totalPrayers += t.totalCount; totalPotential += t.totalPotential; });
            let groupPct = totalPotential === 0 ? 0 : Math.round((totalPrayers/totalPotential)*100);
            
            if (groupPct >= 90) {
                 list.innerHTML += `<li><i class="fa-solid fa-users text-emerald-500 w-5"></i> <b>Amazing group effort!</b> The class is maintaining a ${groupPct}% completion rate.</li>`;
            } else if (groupPct > 0) {
                 list.innerHTML += `<li><i class="fa-solid fa-chart-line text-purple-500 w-5"></i> Group average is at ${groupPct}%. Let's strive for consistency!</li>`;
            }

            renderPaperSheets(dates, stats);
        }

        function renderPaperSheets(dates, stats) {
            const container = document.getElementById('paper-sheets-container');
            container.innerHTML = '';
            
            const todayStr = new Date().toISOString().split('T')[0];

            STUDENTS.forEach(student => {
                let colorTheme = student.gender === 'girl' ? 'text-pink-600 border-pink-200' : 'text-blue-600 border-blue-200';
                let headerBg = student.gender === 'girl' ? 'bg-pink-50' : 'bg-blue-50';
                
                let st = stats[student.name];

                let summaryBar = `
                    <div class="summary-bar">
                        <span><span class="arabic-text font-normal text-lg">صبح:</span> ${st.breakdown['Subh']}</span>
                        <span><span class="arabic-text font-normal text-lg">ظهر:</span> ${st.breakdown['Luhr']}</span>
                        <span><span class="arabic-text font-normal text-lg">عصر:</span> ${st.breakdown['Asr']}</span>
                        <span><span class="arabic-text font-normal text-lg">مغرب:</span> ${st.breakdown['Magrib']}</span>
                        <span><span class="arabic-text font-normal text-lg">عشاء:</span> ${st.breakdown['Isha']}</span>
                    </div>
                `;
                
                let tableHtml = `
                <div class="paper-grid flex flex-col h-[70vh]">
                    <div class="student-header ${headerBg}">
                        <span class="uppercase tracking-widest ${colorTheme}">${student.name}</span>
                        <span class="text-xs bg-white px-2 py-1 rounded shadow-sm text-gray-500 border border-gray-200">Total: ${st.totalCount} / ${st.totalPotential}</span>
                    </div>
                    ${summaryBar}
                    <div class="overflow-y-auto flex-grow">
                        <table class="w-full text-left border-collapse">
                            <thead class="sticky top-0 bg-white shadow-sm z-10">
                                <tr>
                                    <th class="p-2 border-b border-r text-xs uppercase tracking-wider text-gray-500 bg-gray-50 whitespace-nowrap">Date</th>
                                    ${PRAYER_ARABIC.map(p => `<th class="p-2 border-b arabic-text font-normal text-lg">${p}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                `;

                dates.forEach((date) => {
                    const [year, month, day] = date.split('-');
                    const displayDate = `${day}-${month}-${year}`;
                    const isToday = date === todayStr;
                    
                    const record = (allRecords[date] && allRecords[date][student.name]) || {};
                    let isFullDayExcused = record.excused === true; // Legacy fallback
                    
                    let cellsHtml = PRAYERS.map((p) => {
                        let val = record[p];
                        if (isFullDayExcused) val = 'excused';
                        
                        let done = val === true || val === '1';
                        let excused = val === 'excused';
                        
                        let icon = '';
                        if (done) icon = '<i class="fa-solid fa-check text-blue-600 font-bold text-xl drop-shadow-sm"></i>';
                        else if (excused) icon = '<i class="fa-solid fa-moon text-pink-400 font-bold text-lg drop-shadow-sm"></i>';
                        
                        return `<td class="p-1 text-center border-l border-gray-100"><div class="w-full h-8 flex items-center justify-center text-lg">${icon}</div></td>`;
                    }).join('');

                    const rowClass = isToday ? 'bg-blue-50' : 'bg-white';

                    tableHtml += `
                        <tr class="${rowClass} hover:bg-gray-50 transition-colors">
                            <td class="p-2 text-center font-bold border-r sticky left-0 z-0 whitespace-nowrap ${isToday ? 'bg-blue-50 text-blue-700' : 'bg-gray-50 text-gray-700'}">${displayDate}</td>
                            ${cellsHtml}
                        </tr>
                    `;
                });

                tableHtml += `</tbody></table></div></div>`;
                container.innerHTML += tableHtml;
            });
        }

        window.switchTab = function(tabName) {
            document.getElementById('student-dashboard-view').classList.add('hidden');
            document.getElementById('sheet-view').classList.add('hidden');
            document.getElementById('tab-dashboard').className = "px-4 py-1.5 text-sm font-medium rounded-md transition text-gray-500 hover:text-gray-700";
            document.getElementById('tab-sheet').className = "px-4 py-1.5 text-sm font-medium rounded-md transition text-gray-500 hover:text-gray-700";
            
            document.getElementById(`tab-${tabName}`).className = "px-4 py-1.5 text-sm font-medium rounded-md transition bg-white shadow-sm text-gray-800";
            if (tabName === 'dashboard') document.getElementById('student-dashboard-view').classList.remove('hidden');
            if (tabName === 'sheet') document.getElementById('sheet-view').classList.remove('hidden');
        };

        window.onload = initApp;
    </script>
</body>
</html>
